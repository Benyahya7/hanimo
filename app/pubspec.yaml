name: animeapp
description: "Hanimo — anime from Animeify's server. Clean rebuild (2.0)."
publish_to: 'none'

# 2.0.1+17: build number 17 so it installs over 2.0.0 (build 16).
version: 2.0.1+17

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # Firebase (project anime-app-556c8)
  firebase_core: ^4.4.1
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_messaging: ^16.1.2
  google_sign_in: ^7.2.0

  # Network, images, player
  http: ^1.6.0
  cached_network_image: ^3.4.1
  video_player: ^2.10.1
  share_plus: ^11.1.0
  url_launcher: ^6.3.2

  # Local state
  shared_preferences: ^2.5.3
  provider: ^6.1.2

  # Notifications (update alerts)
  flutter_local_notifications: ^22.3.3
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/banners/
    - assets/icon/
